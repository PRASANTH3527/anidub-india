name = "anidub-api"
main = "worker.js"
compatibility_date = "2024-10-24"

# Cloudflare KV Namespace Binding for Global Anime Catalog Persistence
[[kv_namespaces]]
binding = "ANIME_DB"
id = "YOUR_KV_NAMESPACE_ID" # Replace with your KV Namespace ID from Cloudflare dashboard if deploying via Wrangler CLI

[vars]
ENVIRONMENT = "production"
