name = "anidub-india"
main = "src/edge-entry.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/ws/*"]

[[d1_databases]]
binding = "DB"
database_name = "anime-db"
database_id = "75f053ab-5b44-4d48-abf8-b3a357a89426"

