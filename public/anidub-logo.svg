<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a00" />
      <stop offset="100%" stop-color="#ff5a1f" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>
  </defs>

  <!-- Logo Mark: Headphone & Play A -->
  <g transform="translate(15, 10)">
    <!-- Outer Headphone Arch -->
    <path d="M 25 45 C 25 15, 75 10, 105 35" fill="none" stroke="url(#darkGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 45 28 C 45 18, 75 15, 95 32" fill="none" stroke="url(#orangeGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Earcups -->
    <circle cx="25" cy="50" r="10" fill="#1e2330" />
    <circle cx="110" cy="50" r="10" fill="#ff5a1f" />

    <!-- Stylized A / Play Triangle -->
    <polygon points="45,65 75,25 90,65" fill="url(#darkGrad)" />
    <!-- Orange Play Button Triangle -->
    <polygon points="50,60 72,43 50,26" fill="url(#orangeGrad)" />
  </g>

  <!-- Typography: anidub INDIA -->
  <g transform="translate(130, 68)">
    <!-- anidub -->
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ff6a00" letter-spacing="-1">anidub</text>
    
    <!-- INDIA -->
    <text x="5" y="26" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="16" fill="#1e2330" letter-spacing="8">INDIA</text>

    <!-- Tricolor Flag Bar -->
    <g transform="translate(38, 35)">
      <rect x="0" y="0" width="18" height="3" fill="#ff9933" rx="1" />
      <rect x="18" y="0" width="18" height="3" fill="#ffffff" rx="1" />
      <rect x="36" y="0" width="18" height="3" fill="#138808" rx="1" />
    </g>
  </g>
</svg>
