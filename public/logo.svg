<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 66" width="280" height="66" fill="none">
  <!-- Icon Group -->
  <g transform="translate(4, 3)">
    <!-- Orange Speech Bubble with Pointer -->
    <path d="M 18,2 C 8,2 2,8 2,18 L 2,34 C 2,44 8,50 18,50 L 20,50 L 14,60 C 13,62 15,64 17,63 L 29,51 C 30,50 32,50 34,50 L 52,50 C 62,50 68,44 68,34 L 68,18 C 68,8 62,2 52,2 Z" 
          fill="#FF6A00" />
    
    <!-- Black Play Triangle -->
    <polygon points="28,17 28,35 44,26" fill="#0B0F17" />
    
    <!-- Inner Sound Wave (White) -->
    <path d="M 74,18 C 79,23 79,29 74,34" 
          stroke="#FFFFFF" 
          stroke-width="4.5" 
          stroke-linecap="round" />
    
    <!-- Outer Sound Wave (Vibrant Green) -->
    <path d="M 83,11 C 92,20 92,32 83,41" 
          stroke="#22C55E" 
          stroke-width="4.5" 
          stroke-linecap="round" />
  </g>

  <!-- Wordmark Group -->
  <g transform="translate(108, 0)">
    <!-- "ANI" in White + "DUB" in Orange -->
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5px">
      <tspan fill="#FFFFFF">ANI</tspan><tspan fill="#FF6A00">DUB</tspan>
    </text>

    <!-- "I N D I A" in clean tracked white text -->
    <text x="2" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#FFFFFF" letter-spacing="4px">INDIA</text>
    
    <!-- Horizontal Accent Line -->
    <line x1="56" y1="51" x2="160" y2="51" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
